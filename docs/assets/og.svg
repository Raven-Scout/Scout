<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Scout: start every day knowing what actually needs you.">
  <!-- Source for og.png (the social-share card). Render: open this file over http at a
       1200x630 viewport and screenshot it, so the self-hosted fonts load. -->
  <style>
    @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('fonts/inter.woff2') format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url('fonts/jetbrains-mono.woff2') format('woff2'); }
    .sans { font-family: 'Inter', -apple-system, system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  </style>
  <rect width="1200" height="630" fill="#fbfaf8"/>
  <circle cx="1120" cy="-40" r="420" fill="#f6ebe3"/>
  <image href="scout-icon.svg" x="80" y="72" width="64" height="64"/>
  <text x="160" y="116" class="sans" font-size="34" font-weight="700" fill="#1b1916" letter-spacing="-0.6">Scout</text>

  <text class="sans" font-size="72" font-weight="700" fill="#1b1916" letter-spacing="-2.4">
    <tspan x="80" y="262">Start every day knowing</tspan>
    <tspan x="80" y="346">what actually needs you.</tspan>
  </text>
  <text class="sans" font-size="28" fill="#48443d">
    <tspan x="80" y="420">An open-source background agent for Claude Code. It reads your</tspan>
    <tspan x="80" y="458">tools, cross-checks them, and keeps your notes on your Mac.</tspan>
  </text>

  <g class="mono" font-size="20" font-weight="500">
    <rect x="80" y="514" width="130" height="40" rx="8" fill="#e6f2ea"/>
    <text x="145" y="540" text-anchor="middle" fill="#2c7349">verified</text>
    <rect x="224" y="514" width="200" height="40" rx="8" fill="#fbf1d9"/>
    <text x="324" y="540" text-anchor="middle" fill="#8a5d00">single-source</text>
    <rect x="438" y="514" width="184" height="40" rx="8" fill="#fbe9e7"/>
    <text x="530" y="540" text-anchor="middle" fill="#b0302a">contradicted</text>
  </g>
  <text x="1120" y="541" text-anchor="end" class="sans" font-size="22" fill="#66615a">raven-scout.github.io/Scout</text>
</svg>
