<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Scout: your work, as files you own.">
  <!-- Source for og.png (the social-share card). Render: open this file over http at a
       1200x630 viewport and screenshot it, so the self-hosted fonts load. -->
  <style>
    @font-face { font-family: 'Geist'; font-weight: 100 900; src: url('fonts/geist.woff2') format('woff2'); }
    @font-face { font-family: 'Geist Mono'; font-weight: 100 900; src: url('fonts/geist-mono.woff2') format('woff2'); }
    .sans { font-family: 'Geist', -apple-system, system-ui, sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  </style>
  <rect width="1200" height="630" fill="#f3f4f1"/>
  <image href="scout-icon.svg" x="80" y="64" width="56" height="56"/>
  <text x="152" y="103" class="sans" font-size="32" font-weight="650" fill="#15171a" letter-spacing="-0.6">Scout</text>

  <text x="80" y="190" class="mono" font-size="20" fill="#5d6369">[ <tspan fill="#8a3712">for Claude Code</tspan> ]</text>
  <text class="sans" font-size="76" font-weight="650" fill="#15171a" letter-spacing="-2.6">
    <tspan x="76" y="272">Your work,</tspan>
    <tspan x="76" y="356">as files you own.</tspan>
  </text>
  <text class="sans" font-size="26" fill="#41464b">
    <tspan x="80" y="418">An open-source background agent for Claude</tspan>
    <tspan x="80" y="454">Code. It reads your tools, cross-checks them,</tspan>
    <tspan x="80" y="490">and keeps what it learns as files on your Mac.</tspan>
  </text>

  <g class="mono" font-size="19" font-weight="500">
    <rect x="80" y="530" width="124" height="38" rx="8" fill="#e4f1e8"/>
    <text x="142" y="555" text-anchor="middle" fill="#2c7349">verified</text>
    <rect x="216" y="530" width="182" height="38" rx="8" fill="#f9f0d8"/>
    <text x="307" y="555" text-anchor="middle" fill="#8a5d00">single-source</text>
    <rect x="410" y="530" width="168" height="38" rx="8" fill="#fae8e6"/>
    <text x="494" y="555" text-anchor="middle" fill="#b0302a">contradicted</text>
  </g>

  <rect x="800" y="140" width="320" height="330" rx="16" fill="#16181b"/>
  <g class="mono" font-size="18">
    <text x="828" y="184" fill="#ee8a5c" font-weight="500">~/Scout</text>
    <line x1="828" y1="202" x2="1092" y2="202" stroke="#2c3034"/>
    <text x="828" y="238" fill="#e9ece8">action-items/</text>
    <text x="828" y="266" fill="#e9ece8">knowledge-base/</text>
    <text x="852" y="294" fill="#e9ece8">people/</text>
    <text x="852" y="322" fill="#e9ece8">projects/</text>
    <text x="852" y="350" fill="#e9ece8">topics/</text>
    <text x="852" y="378" fill="#e9ece8">sources/</text>
    <text x="828" y="406" fill="#e9ece8">meetings/</text>
    <text x="828" y="446" fill="#9aa09b" font-size="15">one git commit per run</text>
  </g>
  <text x="1120" y="555" text-anchor="end" class="sans" font-size="22" fill="#5d6369">raven-scout.github.io/Scout</text>
</svg>
