<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Scout: reads your work tools on a schedule and leaves a short, sourced list of what needs you.">
  <!-- Source for github-social-preview.png, the image GitHub shows when someone shares a link to the
       repository (Settings > General > Social preview; GitHub has no API for it). It is a sibling of
       og.svg, the website's share card, at GitHub's recommended 1280x640.
       Everything that matters sits inside x 100-1180, y 72-568, so sites that crop the card still show it.
       Render: serve docs/assets over http (so the self-hosted fonts load), open this file in headless
       Chrome with a 1280x640 window and take a screenshot. Keep the PNG under 1 MB. -->
  <style>
    @font-face { font-family: 'Geist'; font-weight: 100 900; src: url('fonts/geist.woff2') format('woff2'); }
    @font-face { font-family: 'Geist Mono'; font-weight: 100 900; src: url('fonts/geist-mono.woff2') format('woff2'); }
    .sans { font-family: 'Geist', -apple-system, system-ui, sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  </style>
  <rect width="1280" height="640" fill="#f3f4f1"/>

  <!-- Name -->
  <image href="scout-icon.svg" x="100" y="96" width="104" height="104"/>
  <text x="228" y="186" class="sans" font-size="104" font-weight="650" fill="#15171a" letter-spacing="-3.5">Scout</text>

  <!-- What it does -->
  <text class="sans" font-size="36" font-weight="500" fill="#15171a" letter-spacing="-0.6">
    <tspan x="100" y="290">Reads your work tools on a schedule,</tspan>
    <tspan x="100" y="338">cross-checks them, and leaves a short,</tspan>
    <tspan x="100" y="386">sourced list of what needs you.</tspan>
  </text>
  <text x="100" y="436" class="sans" font-size="25" fill="#41464b">Plus a knowledge base of plain Markdown you own.</text>

  <g class="mono" font-size="20" font-weight="500">
    <rect x="100" y="476" width="130" height="40" rx="8" fill="#e4f1e8"/>
    <text x="165" y="502" text-anchor="middle" fill="#2c7349">verified</text>
    <rect x="242" y="476" width="190" height="40" rx="8" fill="#f9f0d8"/>
    <text x="337" y="502" text-anchor="middle" fill="#8a5d00">single-source</text>
    <rect x="444" y="476" width="176" height="40" rx="8" fill="#fae8e6"/>
    <text x="532" y="502" text-anchor="middle" fill="#b0302a">contradicted</text>
  </g>

  <!-- Small visual: the vault it writes -->
  <rect x="840" y="120" width="340" height="364" rx="18" fill="#16181b"/>
  <g class="mono" font-size="20">
    <text x="870" y="168" fill="#ee8a5c" font-weight="500">~/Scout</text>
    <line x1="870" y1="188" x2="1150" y2="188" stroke="#2c3034"/>
    <text x="870" y="226" fill="#e9ece8">action-items/</text>
    <text x="870" y="257" fill="#e9ece8">knowledge-base/</text>
    <text x="896" y="288" fill="#e9ece8">people/</text>
    <text x="896" y="319" fill="#e9ece8">projects/</text>
    <text x="896" y="350" fill="#e9ece8">topics/</text>
    <text x="896" y="381" fill="#e9ece8">sources/</text>
    <text x="870" y="412" fill="#e9ece8">meetings/</text>
    <text x="870" y="454" fill="#9aa09b" font-size="16">one git commit per run</text>
  </g>

  <!-- Footer -->
  <text x="100" y="566" class="mono" font-size="21" fill="#5d6369">[ <tspan fill="#8a3712">open source · MIT</tspan> ]</text>
  <text x="1180" y="566" text-anchor="end" class="sans" font-size="23" fill="#5d6369">github.com/Raven-Scout/Scout</text>
</svg>
