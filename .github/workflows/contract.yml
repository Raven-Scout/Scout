      # 13. The investigation prompts (`scoutctl health resolve-prompt <kind>
      #     <key> --json`) behind the app's "Resolve with Claude" button: same
      #     rule as the doctor fixture.
      - name: Resolve prompt fixture is byte-identical across clients
        run: |
          set -uo pipefail
