                echo "::error file=$path::tracked usage-summary.json copy was never compared by this step — add it to, or make it match, the apps/*/[Ss]cout*Tests/Fixtures/ glob"
                status=1
                ;;
            esac
          done <<< "$tracked"
          exit $status

      # 8. `scoutctl protection status --json`, which the app's Run protection
      #    card reads: same rule as the doctor fixture.
      - name: Protection status fixture is byte-identical across clients
        run: |
          set -uo pipefail
          canonical=plugin/engine/tests/fixtures/contract/protection-status.json
          status=0
          checked=0
          checked_list=" "
          for copy in apps/*/[Ss]cout*Tests/Fixtures/protection-status.json; do
