              echo "OK  $copy"
            else
              echo "::error file=$copy::protection-status.json is not byte-identical to $canonical — regenerate it with SCOUT_REGEN_CONTRACT=1 (tests/unit/test_run_protection_contract.py), then cp it over $copy"
              status=1
            fi
