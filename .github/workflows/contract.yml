                status=1
                ;;
            esac
          done <<< "$tracked"
          exit $status

      # The vault layout (`scoutctl vault layout --json`, layout v2, ADR 0011):
      #     the app's VaultLayout constants are pinned to it. Same rule as the
      #     doctor fixture.
      - name: Vault layout fixture is byte-identical across clients
        run: |
          set -uo pipefail
          canonical=plugin/engine/tests/fixtures/contract/vault-layout.json
          status=0
          checked=0
          checked_list=" "
          for copy in apps/*/[Ss]cout*Tests/Fixtures/vault-layout.json; do
