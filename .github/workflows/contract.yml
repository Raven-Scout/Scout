                status=1
                ;;
            esac
          done <<< "$tracked"
          exit $status

      # 9. The run ledger (`scoutctl runs --json`) the app's Health panel reads:
      #    same rule as the doctor fixture.
      - name: Run ledger fixture is byte-identical across clients
        run: |
          set -uo pipefail
          canonical=plugin/engine/tests/fixtures/contract/run-ledger.json
          status=0
          checked=0
          checked_list=" "
          for copy in apps/*/[Ss]cout*Tests/Fixtures/run-ledger.json; do
