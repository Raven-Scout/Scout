            else
              echo "::error file=$copy::resolve-prompt.json is not byte-identical to $canonical — regenerate it with SCOUT_REGEN_CONTRACT=1 (tests/unit/test_resolve_prompt_contract.py), then cp it over $copy"
              status=1
            fi
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::no client copy of resolve-prompt.json found — the glob may be stale"
            status=1
          fi

          tracked="$(git ls-files -- '*resolve-prompt.json')"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            [ "$path" = "$canonical" ] && continue
            case "$checked_list" in
              *" $path "*) echo "OK  $path (discovered)" ;;
              *)
                echo "::error file=$path::tracked resolve-prompt.json copy was never compared by this step — add it to, or make it match, the apps/*/[Ss]cout*Tests/Fixtures/ glob"
                status=1
                ;;
            esac
          done <<< "$tracked"
          exit $status

  contract:
    name: contract
    needs: [changes, verify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any gated job failed or was cancelled
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "needs results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a gated job ended '$r'"; exit 1 ;;
            esac
          done
