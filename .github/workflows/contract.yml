          exit $status

      # 12. The progress watcher's line (`.scout-logs/.scout-session.lock.alive`,
      #     engine scout/run_progress.py) the app's SessionLogService reads to
      #     tell a working run from a hung one: same rule as the doctor fixture.
      - name: Run progress fixture is byte-identical across clients
