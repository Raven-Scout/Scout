                status=1
                ;;
            esac
          done <<< "$tracked"
          exit $status

      # 10. The delegate mirror status (`scoutctl delegate status --json`) the
      #     app's Settings ▸ Agent copies card reads (#550): same rule as the
      #     doctor fixture.
      - name: Delegate status fixture is byte-identical across clients
        run: |
          set -uo pipefail
          canonical=plugin/engine/tests/fixtures/contract/delegate-status.json
          status=0
          checked=0
          checked_list=" "
          for copy in apps/*/[Ss]cout*Tests/Fixtures/delegate-status.json; do
