name: plugin-test

on:
  push:
    branches: [main, "migrate/**"]
    paths:
      - "plugin/**"
      - ".claude-plugin/**"
      - ".github/workflows/plugin-test.yml"
  pull_request:
  workflow_call:

# A new push to a PR cancels the run for its previous head. The org gets five
# macOS runners at once on GitHub's free plan, shared by every workflow and
# repo, and a superseded run's ~20-minute macOS leg held one of them while the
# current head queued behind it. Pushes to main and workflow_call runs each get
# their own group (the run id), so nothing on main is ever cancelled or held.
concurrency:
  group: plugin-test-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path-scoped `paths:` filters were removed from `on.pull_request` above so
  # this workflow can be a required status check (ruling R30): a check
  # skipped by `paths:` filtering is stuck "Pending" forever and blocks
  # merging, while a job skipped by an `if:` conditional reports "Success".
  # This job decides, and every other job gates on its output. A
  # workflow_call (release-plugin tagging a release) or workflow_dispatch is
  # not a pull_request event, so changed-paths.sh always runs it.
  #
  # A release PR (`scripts/release.sh prepare`: version lines and CHANGELOGs
  # only) skips the suite too — see version-bump-only.sh. plugin-lint and
  # contract still run `versioning check` on it, and the push to main after
  # the merge runs this workflow in full.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.match.outputs.run == 'true' && steps.release.outputs.version_only != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: match
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/changed-paths.sh '^(plugin/|\.claude-plugin/|scripts/|apps/macos/Scout\.xcodeproj/project\.pbxproj$|\.github/workflows/(plugin-test|rerun-unacquired)\.yml$|\.github/scripts/rerun_unacquired\.py$|\.github/scripts/(changed-paths|version-bump-only)\.sh$)'
      - id: release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/version-bump-only.sh

  # Three legs, not the full os × python grid. Over the 60 runs before this
  # matrix was trimmed (2026-10), every real failure failed on all four legs;
  # the only single-leg failures were macOS timing flakes, on 3.11 and 3.12
  # alike. So: one macOS leg, and both Pythons on the cheaper Ubuntu.
  #
  # Coverage rides on the ubuntu/3.12 leg. It needs the `[full]` extra: every
  # scout/tui test is gated on `pytest.importorskip("textual")`, so a
  # `[dev]`-only install skips the whole TUI package and the total drops ~3
  # points below the gate. The other two legs stay `[dev]`-only, so the
  # textual-absent path is still exercised. The threshold itself lives in
  # [tool.coverage.report] fail_under.
  #
  # The suite runs in parallel (pytest-xdist), then the `perf` tests run alone
  # and serially: they time scoutctl's cold start, which other workers would
  # skew. On the coverage leg they run under coverage too (appended to the
  # parallel run's data), as they did when coverage was a separate job; the
  # other two legs time them without a tracer. `-rP` prints what each passing
  # perf test printed (its timings), so a budget can be set from passing runs
  # too, not only failures (#600). Neither pytest step checks the
  # floor (each sees only part of the data); `coverage report` does, on the
  # combined total.
  #
  # `workers` is twice the runner's cores (ubuntu-latest 4, macos-latest 3):
  # most of the suite waits on subprocesses (shell runners, git, fake claude),
  # not the CPU. Measured on #439: the coverage leg's parallel step went 278s
  # -> 145s and macOS 323s -> 263s against `-n auto`.
  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            extras: dev
            workers: 8
          - os: ubuntu-latest
            python: "3.12"
            extras: dev,full
            coverage: true
            workers: 8
          - os: macos-latest
            python: "3.12"
            extras: dev
            workers: 6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: plugin/engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: plugin/engine/pyproject.toml
      - name: Setup Python
        run: uv python install ${{ matrix.python }}
      - name: Create venv
        run: uv venv --python ${{ matrix.python }}
      - name: Install
        run: uv pip install -e ".[${{ matrix.extras }}]"
      # `scoutctl kb search` runs ripgrep when it is on PATH (#453); with it
      # installed the real-rg tests run instead of skipping. The Python
      # fallback is covered either way (the tests hide rg to reach it).
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ripgrep; else sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; fi
          rg --version
      # The JUnit XML keeps every test's duration, so a slow leg can be
      # broken down by file afterwards, not only by the 30 slowest tests.
      - name: Pytest (parallel)
        run: .venv/bin/pytest tests/ -n ${{ matrix.workers }} -m "not perf" --durations=30 --junitxml="$RUNNER_TEMP/junit/parallel.xml" ${{ matrix.coverage && '--cov --cov-report= --cov-fail-under=0' || '' }}
      - name: Pytest (perf, serial)
        run: .venv/bin/pytest tests/ -m perf -p no:xdist -rP --junitxml="$RUNNER_TEMP/junit/perf.xml" ${{ matrix.coverage && '--cov --cov-append --cov-report= --cov-fail-under=0' || '' }}
      - name: Keep test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: ignore
          retention-days: 14
      # Exits non-zero below [tool.coverage.report] fail_under, rounding the
      # total to its `precision` (tests/unit/test_coverage_gate.py pins both).
      - name: Coverage floor
        if: matrix.coverage
        run: .venv/bin/coverage report
      # (removed) Verify connectors.snapshot.json drift  -> contract.yml
      # (removed) Verify schedule.snapshot.json drift    -> contract.yml

  plugin-test:
    name: plugin-test
    needs: [changes, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any gated job failed or was cancelled
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "needs results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a gated job ended '$r'"; exit 1 ;;
            esac
          done
