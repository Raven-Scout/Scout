name: plugin-test

on:
  push:
    branches: [main, "migrate/**"]
    paths:
      - "plugin/**"
      - ".claude-plugin/**"
      - ".github/workflows/plugin-test.yml"
  pull_request:
  workflow_call:

jobs:
  # Path-scoped `paths:` filters were removed from `on.pull_request` above so
  # this workflow can be a required status check (ruling R30): a check
  # skipped by `paths:` filtering is stuck "Pending" forever and blocks
  # merging, while a job skipped by an `if:` conditional reports "Success".
  # This job decides, and every other job gates on its output. A
  # workflow_call (release-plugin tagging a release) or workflow_dispatch is
  # not a pull_request event, so changed-paths.sh always runs it.
  #
  # A release PR (`scripts/release.sh prepare`: version lines and CHANGELOGs
  # only) skips the suite too — see version-bump-only.sh. plugin-lint and
  # contract still run `versioning check` on it, and the push to main after
  # the merge runs this workflow in full.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.match.outputs.run == 'true' && steps.release.outputs.version_only != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: match
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/changed-paths.sh '^(plugin/|\.claude-plugin/|scripts/|apps/macos/Scout\.xcodeproj/project\.pbxproj$|\.github/workflows/plugin-test\.yml$|\.github/scripts/(changed-paths|version-bump-only)\.sh$)'
      - id: release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/version-bump-only.sh

  # Three legs, not the full os × python grid. Over the 60 runs before this
  # matrix was trimmed (2026-10), every real failure failed on all four legs;
  # the only single-leg failures were macOS timing flakes, on 3.11 and 3.12
  # alike. So: one macOS leg, and both Pythons on the cheaper Ubuntu.
  #
  # Coverage rides on the ubuntu/3.12 leg. It needs the `[full]` extra: every
  # scout/tui test is gated on `pytest.importorskip("textual")`, so a
  # `[dev]`-only install skips the whole TUI package and the total drops ~3
  # points below the gate. The other two legs stay `[dev]`-only, so the
  # textual-absent path is still exercised. The threshold itself lives in
  # [tool.coverage.report] fail_under.
  #
  # The suite runs in parallel (pytest-xdist), then the `perf` tests run alone
  # and serially: they time scoutctl's cold start, which other workers would
  # skew. On the coverage leg they run under coverage too (appended to the
  # parallel run's data), as they did when coverage was a separate job; the
  # other two legs time them without a tracer. Neither pytest step checks the
  # floor (each sees only part of the data); `coverage report` does, on the
  # combined total.
  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            extras: dev
            workers: 8
          - os: ubuntu-latest
            python: "3.12"
            extras: dev,full
            coverage: true
            workers: 8
          - os: macos-latest
            python: "3.12"
            extras: dev
            workers: 6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: plugin/engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: plugin/engine/pyproject.toml
      - name: Setup Python
        run: uv python install ${{ matrix.python }}
      - name: Create venv
        run: uv venv --python ${{ matrix.python }}
      - name: Install
        run: uv pip install -e ".[${{ matrix.extras }}]"
      - name: Pytest (parallel)
        run: .venv/bin/pytest tests/ -n ${{ matrix.workers }} -m "not perf" --durations=20 ${{ matrix.coverage && '--cov --cov-report= --cov-fail-under=0' || '' }}
      - name: Pytest (perf, serial)
        run: .venv/bin/pytest tests/ -m perf -p no:xdist ${{ matrix.coverage && '--cov --cov-append --cov-report= --cov-fail-under=0' || '' }}
      # Exits non-zero below [tool.coverage.report] fail_under, rounding the
      # total to its `precision` (tests/unit/test_coverage_gate.py pins both).
      - name: Coverage floor
        if: matrix.coverage
        run: .venv/bin/coverage report
      # (removed) Verify connectors.snapshot.json drift  -> contract.yml
      # (removed) Verify schedule.snapshot.json drift    -> contract.yml

  plugin-test:
    name: plugin-test
    needs: [changes, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any gated job failed or was cancelled
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "needs results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a gated job ended '$r'"; exit 1 ;;
            esac
          done
