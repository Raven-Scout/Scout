# Scripted connector responses for kb-front-page (tests/eval/harness/stubs/rules.py).
# A day of new signals about the report-builder project, all from {{d-1}} after the last run:
# - GitHub: the export streaming PR example-org/api#57 merged;
# - Linear: PROJ-1240 (retire the nightly PDF job) moved to Done, with Sam's comment;
# - Calendar and Gmail: the weekly sync happened, and its notes say the row cap goes to 200,000.
# Every persona ends in a quiet default, so an unforeseen query reads as "nothing new".

gh:
  "*":
    - match: {argv: '^auth status'}
      respond: {stdout: "github.com\n  ✓ Logged in to github.com account alex-example"}
    - match: {argv: '^pr view 57\b'}
      respond: {stdout: fixtures/gh-pr-57.json}
    - match: {argv: '^api .*pulls/57\b'}
      respond: {stdout: fixtures/gh-pr-57.json}
    # Merged or closed lists, by repo or by author, all hold #57.
    - match: {argv: '^(?:pr list|search prs) .*(?:merged|--state (?:closed|all))'}
      respond: {stdout: fixtures/gh-merged-prs.json}
    - match: {argv: '^search prs .*--author'}
      respond: {stdout: fixtures/gh-merged-prs.json}
    - respond: {stdout: "[]"}

slack:
  slack_read_user_profile:
    - respond: {user: {id: U0123456789, real_name: Alex Example, tz: UTC}}
  slack_send_message:
    - capture: wrap
  "*":
    - respond: {messages: []}

linear:
  list_teams:
    - respond: {teams: [{key: PROJ, name: Platform}]}
  list_issues:
    - respond: fixtures/linear-issues.json
  get_issue:
    - match: {id: PROJ-1240}
      respond: fixtures/linear-proj-1240.json
    - respond: {}
  list_comments:
    - match: {issueId: '^PROJ-1240$'}
      respond: fixtures/linear-comments-proj-1240.json
    - respond: {comments: []}
  "*":
    - respond: {}

calendar:
  list_calendars:
    - respond: {calendars: [{id: primary, summary: Alex Example}]}
  gcal_list_events:
    - respond: fixtures/calendar-events.json
  list_events:
    - respond: fixtures/calendar-events.json
  "*":
    - respond: {events: []}

email:
  gmail_search_messages:
    - respond: fixtures/gmail-search.json
  get_thread:
    - match: {threadId: '^thr-sync-notes$'}
      respond: fixtures/gmail-thread-sync-notes.json
    - respond: {messages: []}
  "*":
    - respond: {messages: []}
