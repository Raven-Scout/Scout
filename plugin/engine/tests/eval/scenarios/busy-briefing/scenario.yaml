  "ref:example-org/widgets#20": [🔴, 🟡]
  "ref:example-org/widgets#21": [🔴, 🟡]
  "ref:example-org/widgets#22": [🟢]
  "ref:example-org/api#40": [🟢]
  "ref:PROJ-1210": [🟢]
  "ref:PROJ-1211": [🟡]

