# busy-briefing: busy-weekday's vault and connectors as a morning briefing (#84, spec
# docs/superpowers/specs/2026-10-13-static-instruction-trim-design.md §8.3). A briefing run reads
# SKILL.md's briefing slice, so this covers the view busy-weekday (a consolidation) doesn't. The
# review-request audit is in no_drop's ref:example-org/widgets#12.
mode: morning-briefing
files_from: busy-weekday
weekdays_only: true
personas: [slack, linear, calendar]
checks: [placement, no_drop, demotion]

